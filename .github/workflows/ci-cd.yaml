# =============================================================================
# GitHub Actions CI/CD Pipeline for helloapp
# =============================================================================
#
# TECHNOLOGY CHOICE: GitHub Actions
#
#   - Zero infrastructure: runs on GitHub-hosted runners — no Jenkins server
#     to maintain, no GitLab instance to host.
#   - Native integration: triggers on push/PR, GITHUB_TOKEN for GHCR auth,
#     built-in caching, matrix builds.
#   - Free tier: generous for open-source and personal repos.
#
#   Alternatives considered:
#     - Jenkins: powerful but requires provisioning and maintaining a server.
#     - GitLab CI: excellent, but requires repo on GitLab or mirror setup.
#     - ArgoCD: complements CI (handles CD only), not a replacement.
#
# PIPELINE:
#
#   ┌──────┐   ┌──────┐   ┌───────────────┐   ┌─────────────┐   ┌────────┐
#   │ Lint │──→│ Test │──→│ Build & Push   │──→│ Trivy Scan  │──→│ Deploy │
#   └──────┘   └──────┘   │ (Docker→GHCR) │   │ (CVE gate)  │   └────────┘
#                          └───────────────┘   └─────────────┘
#
# =============================================================================

name: CI/CD Pipeline

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  IMAGE_NAME: helloapp
  REGISTRY: ghcr.io

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Lint
  # ──────────────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run flake8
        run: |
          pip install flake8
          flake8 helloapp/ --max-line-length=120 --count --show-source --statistics

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Test
  # ──────────────────────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        run: python -m unittest helloapp.test -v

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 3: Build & Push Docker image
  # ──────────────────────────────────────────────────────────────────────────────
  build:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      full-image: ${{ steps.owner.outputs.image_base }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Docker tags must be lowercase, but github.repository_owner preserves
      # original casing (e.g. "Tomii9"). Normalize it once here.
      - name: Lowercase image owner
        id: owner
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "IMAGE_OWNER=$OWNER" >> $GITHUB_ENV
          echo "image_base=${{ env.REGISTRY }}/$OWNER/${{ env.IMAGE_NAME }}" >> $GITHUB_OUTPUT

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}  # lowercased in previous step
          tags: |
            type=sha,prefix=
            type=raw,value=latest

      - name: Build and push production image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      - name: Build and push debug image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.debug
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }}:debug
          labels: ${{ steps.meta.outputs.labels }}

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 4: Security scan with Trivy
  # ──────────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: read
      # Required to upload SARIF results to GitHub Security tab
      security-events: write

    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy vulnerability scanner (table output)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ needs.build.outputs.full-image }}:latest"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "1"

      - name: Run Trivy vulnerability scanner (SARIF report)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ needs.build.outputs.full-image }}:latest"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          limit-severities-for-sarif: true
          ignore-unfixed: true
          exit-code: "0"

      - name: Upload Trivy scan results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: "trivy-results.sarif"

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 5: Deploy to Kubernetes via Helm
  # ──────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build, security-scan]
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Check cluster credentials ──
      - name: Check KUBE_CONFIG
        id: check_kubeconfig
        run: |
          if [ -z "${{ secrets.KUBE_CONFIG }}" ]; then
            echo "KUBE_CONFIG secret is not configured. Skipping deployment."
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi

      # ── Prerequisites ──
      - name: Set up Helm
        if: steps.check_kubeconfig.outputs.skip == 'false'
        uses: azure/setup-helm@v3
        with:
          version: "latest"

      - name: Set up kubectl
        if: steps.check_kubeconfig.outputs.skip == 'false'
        uses: azure/setup-kubectl@v3
        with:
          version: "latest"

      # ── Configure cluster access ──
      # Store your kubeconfig as a base64-encoded GitHub secret named KUBE_CONFIG.
      #   cat ~/.kube/config | base64 -w 0 | gh secret set KUBE_CONFIG
      - name: Configure kubeconfig
        if: steps.check_kubeconfig.outputs.skip == 'false'
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > $HOME/.kube/config

      # ── Deploy with Helm ──
      # --atomic: auto-rollback if the release fails health checks
      # --wait: block until all pods are ready
      # --timeout: max wait time for rollout
      - name: Lowercase image owner
        if: steps.check_kubeconfig.outputs.skip == 'false'
        run: echo "IMAGE_OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Helm upgrade/install
        if: steps.check_kubeconfig.outputs.skip == 'false'
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          helm upgrade --install helloapp ./helm/helloapp \
            --set image.repository=${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/${{ env.IMAGE_NAME }} \
            --set image.tag=${SHORT_SHA} \
            --atomic \
            --wait \
            --timeout 120s

      - name: Verify deployment
        if: steps.check_kubeconfig.outputs.skip == 'false'
        run: kubectl rollout status deployment -l app.kubernetes.io/name=helloapp --timeout=60s
