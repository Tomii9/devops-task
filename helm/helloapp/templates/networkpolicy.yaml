{{- if .Values.networkPolicy.enabled }}
# NetworkPolicy restricts ingress to port {{ .Values.service.targetPort }} only.
# All egress and non-matching ingress ports are denied by default (defence-in-depth).
#
# NOTE: No `from:` selector is specified — any pod/namespace can reach the app port.
# This is intentional for a generic chart where the ingress source is unknown.
# To restrict to specific sources (e.g., an ingress controller), add a `from:`
# selector via values overrides.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "helloapp.fullname" . }}
  labels:
    {{- include "helloapp.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "helloapp.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: {{ .Values.service.targetPort }}
          protocol: TCP
{{- end }}
