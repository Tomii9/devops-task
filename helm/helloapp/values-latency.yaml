# =============================================================================
# ⚡ Performance & latency profile
# =============================================================================
#
# Optimized for minimum response time and consistent P99 latency.
# Fixed replica count (no HPA) eliminates scaling-induced variance.
#
# Key technique: Guaranteed QoS class (requests == limits).
# This gives pods dedicated CPU scheduling — no noisy-neighbor throttling.
#
# Usage:
#   helm install helloapp ./helm/helloapp \
#     -f helm/helloapp/values-latency.yaml
#
# =============================================================================

replicaCount: 3          # Fixed — sized for peak load

gunicorn:
  workers: 2             # Match CPU cores, avoid context switching
  workerClass: sync
  threads: 4             # Threads for concurrent request handling within workers
  keepAlive: 65          # > typical LB idle timeout (60s) to reuse TCP connections
  timeout: 30
  gracefulTimeout: 30

# Guaranteed QoS: requests == limits.
# Kubernetes scheduler gives this pod dedicated CPU time with no throttling.
# This is the single biggest latency optimization on Kubernetes.
resources:
  requests:
    cpu: "500m"
    memory: "128Mi"
  limits:
    cpu: "500m"          # == request → Guaranteed QoS class
    memory: "128Mi"      # == request → Guaranteed QoS class

# HPA DISABLED — scaling introduces latency variance:
#   - New pods take 3-5s to start (cold start penalty)
#   - Scale-down can cause connection drops
#   - CPU throttling during scaling events
# Instead: over-provision with warm replicas sized for peak.
autoscaling:
  enabled: false

pdb:
  enabled: true
  minAvailable: 2        # Maintain HA even during disruptions

# Aggressive readiness probe — remove slow pods from traffic fast.
readinessProbe:
  enabled: true
  httpGet:
    path: /
    port: 8080
  initialDelaySeconds: 2
  periodSeconds: 3       # Check every 3 seconds
  timeoutSeconds: 1      # 1 second = pod is "slow"
  failureThreshold: 1    # Remove after first failure

# Even distribution across availability zones.
topologySpread:
  enabled: true
  maxSkew: 1
  topologyKey: topology.kubernetes.io/zone
  whenUnsatisfiable: DoNotSchedule   # Hard requirement

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxSurge: 1            # Create new pod first — no capacity dip during rollout
    maxUnavailable: 0      # Never kill before replacement is ready

terminationGracePeriodSeconds: 30
preStopSleepSeconds: 5

# Ingress tuned for lowest P99 latency:
# - Persistent upstream keep-alive connections (no repeated TCP handshakes)
# - Proxy buffering disabled for immediate chunk delivery
# - Aggressive proxy timeouts
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/upstream-keepalive-connections: "100"
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "5"
  hosts:
    - host: helloapp-latency.local
      paths:
        - path: /
          pathType: Prefix


